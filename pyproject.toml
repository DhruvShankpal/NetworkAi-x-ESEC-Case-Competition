[project]
name = "seriesdesk"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6.0",
    "faker>=40.44.0",
    "fastapi>=0.162.0",
    "fastmcp>=4,<5",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.8",
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
